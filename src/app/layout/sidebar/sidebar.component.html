<aside class="sidebar">
  <div class="logo">Dash<span class="logo-stack">Stack</span></div>

  <ng-template #item let-it>
    <a class="nav-item" [class.active]="it.active" href="javascript:void(0)">
      <span *ngIf="it.active" class="pill"></span>
      <span *ngIf="it.active" class="bar"></span>
      <app-icon *ngIf="it.icon" class="nav-icon" [name]="it.active ? it.icon + '-active' : it.icon"></app-icon>
      <span class="nav-label">{{ it.label }}</span>
    </a>
  </ng-template>

  <nav class="group group-main">
    <ng-container *ngFor="let it of mainNav"><ng-container *ngTemplateOutlet="item; context: { $implicit: it }"></ng-container></ng-container>
  </nav>

  <div class="divider divider-1"></div>
  <div class="pages-label">PAGES</div>

  <nav class="group group-pages">
    <ng-container *ngFor="let it of pagesNav"><ng-container *ngTemplateOutlet="item; context: { $implicit: it }"></ng-container></ng-container>
  </nav>

  <div class="divider divider-2"></div>

  <nav class="group group-bottom">
    <ng-container *ngFor="let it of bottomNav"><ng-container *ngTemplateOutlet="item; context: { $implicit: it }"></ng-container></ng-container>
  </nav>
</aside>
